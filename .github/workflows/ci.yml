name: CI

on:
  push:
  pull_request:

jobs:
  branch-name-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject non-gitflow branch names
        run: node scripts/check-branch-name.mjs --self-test && node scripts/check-branch-name.mjs

  test:
    needs: branch-name-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --runInBand
      - run: npm run test:html-browser
