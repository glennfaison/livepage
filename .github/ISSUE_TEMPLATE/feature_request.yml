name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For work that is already fully specified and ready for an AFK agent, prefer the **Ready for agent** template instead so it can be labeled and picked up cleanly.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor / page builder
        - Design components
        - Data sources / placeholders
        - Templates
        - Import / export (JSON, shortcode)
        - Standalone HTML export
        - Command palette / theme
        - Docs / tooling / CI
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that LivePage makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketches and examples help.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (optional)
      description: If you can list concrete, testable outcomes, include them here. Fully specified issues can later be labeled ready-for-agent.
      placeholder: |
        - [ ] ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
